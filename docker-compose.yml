services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      - mongodb
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://mongodb:27017/aase
      MONGO_DB: aase
      SECRET_KEY: ${SECRET_KEY:-change-this-before-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-before-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      PADDLE_OCR_DEVICE: cpu
    volumes:
      - backend_uploads:/service/backend/uploads
      - backend_reports:/service/backend/reports/generated

volumes:
  mongo_data:
  backend_uploads:
  backend_reports:
